plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ru.tltsu.schedule'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.tltsu.schedule'
        minSdk 26
        targetSdk 35
        versionCode 28
        versionName '0.9.0'
    }

    def signingFile = System.getenv('KEYSTORE_FILE')
    def signingPassword = System.getenv('KEYSTORE_PASSWORD')

    signingConfigs {
        if (signingFile && signingPassword) {
            release {
                storeFile file(signingFile)
                storeType 'PKCS12'
                storePassword signingPassword
                keyAlias 'schedule-tgu'
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            if (signingFile && signingPassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    testImplementation 'junit:junit:4.13.2'
}
